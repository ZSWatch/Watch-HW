# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    # Generated outputs (KiBot / manufacturing)
    - "!production/**"
    # KiCad generated/backup files
    - "!watch/ZSWatch-Watch-backups/**"
    - "!watch/_autosave-*"
    - "!watch/fp-info-cache"
    - "!watch/*.xml"
    # Binary / CAD exports
    - "!**/*.step"
    - "!**/*.stp"
    - "!**/*.zip"
    - "!**/*.pdf"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.svg"
    - "!**/*.gbr"
    - "!**/*.drl"
    - "!**/*.html"
